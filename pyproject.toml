[project]
name = "golestan-code-mcp"
version = "1.1.0"
description = "Code context MCP server backed by Oracle AI Database 26ai"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.12,<2",
    "oracledb>=3",
    "python-dotenv>=1",
    "tree-sitter>=0.25,<0.26",  # 0.26.0 crashes walking class bodies on Windows
    "tree-sitter-python>=0.25",
    "tree-sitter-go>=0.25",
    "tree-sitter-javascript>=0.25",
]

[project.scripts]
golestan-code-mcp = "golestan_code_mcp.server:main"
golestan-check-db = "golestan_code_mcp.db:main"
golestan-clone-samples = "golestan_code_mcp.samples:main"
ccctx = "golestan_code_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golestan_code_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
